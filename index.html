<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF7; --surface:#FFFFFF; --ink:#161A33; --muted:#5E6486; --line:#D9DDEC; --accent:#3B4BFF; --accent-ink:#FFFFFF;
  --glow:rgba(59,75,255,.14);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1022; --surface:#171A33; --ink:#EEF0FF; --muted:#9BA1C9; --line:#2A2E52; --accent:#7C88FF; --accent-ink:#0E1022;
    --glow:rgba(124,136,255,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1022; --surface:#171A33; --ink:#EEF0FF; --muted:#9BA1C9; --line:#2A2E52; --accent:#7C88FF; --accent-ink:#0E1022;
  --glow:rgba(124,136,255,.18); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:clamp(40px,10vh,96px) 20px 64px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(28px,6vh,56px)}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.02;letter-spacing:-.035em;margin:0 0 10px;max-width:14ch}
.sub{color:var(--muted);margin:0 0 30px;font-size:1.05rem}
.search{position:relative;display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:0 18px;box-shadow:0 12px 40px var(--glow);transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;padding:19px 12px;min-width:0}
.search input::placeholder{color:var(--muted)}
.key{flex:none;border:1px solid var(--line);border-radius:7px;padding:1px 8px;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 34px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.count{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.site{display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;transition:border-color .15s,transform .15s}
.site:hover,.site:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.site:focus-visible,.chip:focus-visible,.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo{flex:none;width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.3rem;background:hsl(var(--h) 80% 90%);color:hsl(var(--h) 60% 32%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:hsl(var(--h) 45% 24%);color:hsl(var(--h) 90% 80%)}}
:root[data-theme="dark"] .logo{background:hsl(var(--h) 45% 24%);color:hsl(var(--h) 90% 80%)}
.info{min-width:0;flex:1}
.name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin:0}
.desc{margin:3px 0 8px;color:var(--muted);font-size:.95rem}
.url{font-size:.85rem;color:var(--accent);overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:6px;padding:1px 8px}
.empty{display:none;text-align:center;padding:48px 16px;color:var(--muted)}
.empty a{color:var(--accent);font-weight:600}
mark{background:var(--glow);color:inherit;border-radius:3px}
footer{margin-top:48px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <span class="brand">Meus sites</span>
    <button class="theme" id="theme" type="button">Tema</button>
  </div>

  <h1 id="greeting">Olá! O que vamos abrir?</h1>
  <p class="sub">Todos os seus projetos em um só lugar.</p>

  <div class="search" role="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar por nome, uso ou categoria" autocomplete="off" aria-label="Buscar sites">
    <span class="key" aria-hidden="true">/</span>
  </div>

  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">
    Nenhum site encontrado para <strong id="term"></strong>.<br>
    <a id="web" href="#" target="_blank" rel="noopener">Pesquisar na web</a>
  </div>

  <footer>Pressione / para buscar e Enter para abrir o primeiro resultado.</footer>
</main>

<script>
/* ============ EDITE AQUI: seus sites ============
   name: nome do site | url: link | desc: pra que serve | cat: categoria | tags: palavras extras pra busca */
const SITES = [
  { name:"Fichas de Personagem", url:"https://erivan-mateus.github.io/fichas/", desc:"Cria fichas de personagens para obras e livros.", cat:"Criação", tags:["personagem","livros","obras","ficha"] },
  { name:"Gestão de Ouro e Lojas", url:"https://erivan-mateus.github.io/teste-ficahs/", desc:"Jogo de gestão de ouro e de lojas.", cat:"Jogos", tags:["game","gestão","ouro","loja"] },
  { name:"Fichas de RPG", url:"https://erivan-mateus.github.io/DeD/", desc:"Cria fichas para diversos sistemas de RPG.", cat:"RPG", tags:["D&D","DeD","ficha","personagem","rpg"] },
  { name:"GrowthQuest", url:"https://erivan-mateus.github.io/growthquest-app/", desc:"Crescimento pessoal, acompanhamento de avanços e anotações de estudo.", cat:"Produtividade", tags:["estudo","anotações","evolução","metas"] },
  { name:"Worldbuild", url:"https://erivan-mateus.github.io/worldbuild/", desc:"Anotações para construção de mundos (worldbuilding).", cat:"Criação", tags:["mundo","lore","anotações","worldbuilding"] },
  { name:"Gota Certa", url:"https://erivan-mateus.github.io/GOTA-CERTA/", desc:"Conta a quantidade de água que você bebeu.", cat:"Saúde", tags:["água","hidratação","contador"] },
  { name:"Tierlists", url:"https://erivan-mateus.github.io/Tierlists/", desc:"Cria tierlists com tópicos, como roteiro, escrita e gráficos.", cat:"Criação", tags:["ranking","tier list","roteiro","escrita","gráficos"] }
];
/* ================================================ */

const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cat = "Todos";

// saudação
const hr = new Date().getHours();
$("greeting").textContent = (hr < 12 ? "Bom dia" : hr < 18 ? "Boa tarde" : "Boa noite") + "! O que vamos abrir?";

// cor do logo derivada do nome
const hue = s => [...s].reduce((a,c) => (a*31 + c.charCodeAt(0)) % 360, 7);
const host = u => { try { return new URL(u).host; } catch(e) { return u; } };

function hi(text, term){
  const t = esc(text);
  if(!term) return t;
  const i = norm(text).indexOf(term);
  if(i < 0) return t;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+term.length)) + "</mark>" + esc(text.slice(i+term.length));
}

function renderChips(){
  const cats = ["Todos", ...new Set(SITES.map(s => s.cat))];
  $("chips").innerHTML = cats.map(c => `<button type="button" class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}

function render(){
  const term = norm($("q").value.trim());
  const found = SITES.filter(s =>
    (cat === "Todos" || s.cat === cat) &&
    (!term || norm([s.name,s.desc,s.cat,s.url,...(s.tags||[])].join(" ")).includes(term))
  );
  $("list").innerHTML = found.map(s => `
    <a class="site" href="${esc(s.url)}" target="_blank" rel="noopener">
      <div class="logo" style="--h:${hue(s.name)}">${esc(s.name[0])}</div>
      <div class="info">
        <h2 class="name">${hi(s.name, term)}</h2>
        <p class="desc">${hi(s.desc, term)}</p>
        <span class="url">${esc(host(s.url))}</span>
        <div class="tags"><span class="tag">${esc(s.cat)}</span>${(s.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>
    </a>`).join("");
  $("count").textContent = found.length + (found.length === 1 ? " site" : " sites");
  $("empty").style.display = found.length ? "none" : "block";
  $("count").style.display = found.length ? "block" : "none";
  if(!found.length){
    $("term").textContent = "“" + $("q").value.trim() + "”";
    $("web").href = "https://www.google.com/search?q=" + encodeURIComponent($("q").value.trim());
  }
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  cat = b.dataset.c; renderChips(); render();
});
$("q").addEventListener("input", render);
$("q").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    const first = document.querySelector(".site");
    if(first) window.open(first.href, "_blank", "noopener");
  }
  if(e.key === "Escape"){ $("q").value = ""; render(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("q")){ e.preventDefault(); $("q").focus(); }
});

// alternar tema
$("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
});

renderChips(); render();
</script>
</body>
</html>
